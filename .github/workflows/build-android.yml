name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Assemble Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: frontend/package.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Clean Dependency Caches
        run: |
          cd frontend
          npm cache clean --force || true
          rm -rf node_modules package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Ensure Android Platform & Capacitor Sync
        run: |
          cd frontend
          if [ ! -d "android" ] && [ ! -d "../android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Locate Gradle & Grant Permissions
        run: |
          if [ -f "frontend/android/gradlew" ]; then
            echo "GRADLE_DIR=frontend/android" >> $GITHUB_ENV
            chmod +x frontend/android/gradlew
          elif [ -f "android/gradlew" ]; then
            echo "GRADLE_DIR=android" >> $GITHUB_ENV
            chmod +x android/gradlew
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLE_PATH" ]; then
              GRADLE_DIR=$(dirname "$GRADLE_PATH")
              echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV
              chmod +x "$GRADLE_PATH"
            else
              echo "Error: gradlew not found!"
              exit 1
            fi
          fi

      - name: Build Android Release APK
        run: |
          cd $GRADLE_DIR
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload Verified Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AccountBook-Release-APK
          path: "**/app/build/outputs/apk/release/*.apk"
          retention-days: 14
