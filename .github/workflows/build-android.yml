name: Build Mobile Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: frontend/package.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Force Generate Android Platform & Gradlew
        run: |
          cd frontend
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Final APK and Assets Artifact
        run: |
          mkdir -p final_apk
          APK_FOUND=$(find frontend/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_FOUND" ]; then
            echo "Found APK at: $APK_FOUND"
            cp "$APK_FOUND" final_apk/AccountBook-Installable.apk
          else
            echo "CRITICAL: No APK produced."
            exit 1
          fi
          
          # Frontend folder se .json aur .html files ko final_apk me copy karega
          find frontend -maxdepth 2 \( -name "*.json" -o -name "*.html" \) -exec cp {} final_apk/ \;

      - name: Upload Verified Installable APK, JSON and HTML
        uses: actions/upload-artifact@v4
        with:
          name: AccountBook-APK
          path: final_apk/
          retention-days: 14
