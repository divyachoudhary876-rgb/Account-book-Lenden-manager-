name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --force

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Prepare Capacitor Android Native Project
        working-directory: frontend
        run: |
          # Agar android folder nahi hai toh auto-create karega
          if [ ! -d "android" ] && [ ! -d "../android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Gradle Permissions & Build Release APK
        run: |
          # Auto-detect whether android folder is in root or frontend
          if [ -f "frontend/android/gradlew" ]; then
            cd frontend/android
          elif [ -f "android/gradlew" ]; then
            cd android
          else
            echo "Searching for gradlew..."
            GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
            cd "$GRADLE_DIR"
          fi

          echo "Working inside: $(pwd)"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AccountBook-Release-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
