name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Assemble Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: frontend/package.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Clean Dependency Caches
        run: |
          cd frontend
          npm cache clean --force || true
          rm -rf node_modules package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Ensure Android Native Platform & Sync
        run: |
          cd frontend
          # If gradlew does not exist anywhere, force add android platform
          if ! find .. -name "gradlew" | grep -q "gradlew"; then
            echo "gradlew not found. Adding Capacitor Android platform..."
            npx cap add android || true
          fi
          npx cap sync android

      - name: Locate Gradle Wrapper & Grant Permissions
        run: |
          echo "Locating gradlew in workspace..."
          GRADLE_PATH=$(find . -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLE_PATH" ]; then
            echo "Attempting to create wrapper using root gradle or fallback..."
            if [ -d "frontend/android" ]; then
              cd frontend/android && gradle wrapper || true && cd ../..
            elif [ -d "android" ]; then
              cd android && gradle wrapper || true && cd ..
            fi
            GRADLE_PATH=$(find . -name "gradlew" -type f | head -n 1)
          fi

          if [ -n "$GRADLE_PATH" ]; then
            echo "Found gradlew at: $GRADLE_PATH"
            chmod +x "$GRADLE_PATH"
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV
          else
            echo "CRITICAL: Could not find or generate gradlew. Workspace tree:"
            pwd
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi

      - name: Build Android Release APK
        run: |
          cd "$GRADLE_DIR"
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload Verified Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AccountBook-Release-APK
          path: "**/app/build/outputs/apk/release/*.apk"
          retention-days: 14
