name: Build Android Release APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 1: Install Dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      # Step 2: Build Web Application
      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      # Step 3: Scaffold Native Android Platform if Missing
      - name: Ensure Capacitor Android Platform
        working-directory: frontend
        run: |
          if [ ! -f "android/settings.gradle" ]; then
            echo "Scaffolding Capacitor Android wrapper..."
            rm -rf android
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      # Step 4: Grant Permissions to Gradle Executable
      - name: Grant Gradle Permissions
        working-directory: frontend/android
        run: chmod +x gradlew

      # Step 5: Assemble Release APK
      - name: Build Android Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease

      # Step 6: Automatically Sign the Release APK for Direct Phone Installation
      - name: Sign Release APK
        working-directory: frontend/android/app/build/outputs/apk/release
        run: |
          # Create a temporary signing key if unsigned file exists
          if [ -f "app-release-unsigned.apk" ]; then
            echo "Signing APK for Android installation..."
            keytool -genkey -v -keystore release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=AccountBook, OU=IT, O=Neelkanth, L=Hanumangarh, ST=Rajasthan, C=IN"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass password app-release-unsigned.apk androidkey
            mv app-release-unsigned.apk Account_Book_Signed.apk
          fi

      # Step 7: Upload Signed APK File as Downloadable Artifact
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
