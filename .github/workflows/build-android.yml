name: Build Android Release APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 1: Install Dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      # Step 2: Build Web Application Bundle
      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      # Step 3: Ensure Native Android Wrapper Exists & Sync
      - name: Ensure Capacitor Android Platform
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      # Step 4: Grant Executable Permissions to Gradle Wrapper
      - name: Grant Gradle Permissions
        working-directory: frontend/android
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "gradlew not found directly; initializing via gradle wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      # Step 5: Compile Android Release APK
      - name: Build Android Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease

      # Step 6: Upload Output Binary Artifact
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
