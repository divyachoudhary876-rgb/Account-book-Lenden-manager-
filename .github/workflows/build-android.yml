# 1. Constant Keystore Parameters (Never Change)
- name: Configure Static Deterministic Master Keystore
  working-directory: frontend/android/app
  run: |
    keytool -genkeypair -v \
      -keystore master_release.keystore \
      -alias businessbook_key \
      -keyalg RSA \
      -keysize 2048 \
      -validity 36500 \
      -storepass "NeelkanthEnterprise@2026" \
      -keypass "NeelkanthEnterprise@2026" \
      -dname "CN=Neelkanth, OU=Accounting, O=NeelkanthEnterprise, L=Hanumangarh, ST=Rajasthan, C=IN"

# 2. Auto-Incrementing Version Code
- name: Auto-Bump Dynamic Version Code & Name
  working-directory: frontend/android/app
  run: |
    BUILD_NUM=${{ github.run_number }}
    VERSION_NAME="1.0.${BUILD_NUM}"
    sed -i "s/versionCode [0-9]*/versionCode ${BUILD_NUM}/g" build.gradle
    sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" build.gradle
