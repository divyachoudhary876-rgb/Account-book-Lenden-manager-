name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Initialize Capacitor Config if Missing
        run: |
          cd frontend
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "BusinessBook" "com.neelkanth.accountbook" --web-dir "dist"
          fi

      - name: Add Android Platform if Missing
        run: |
          cd frontend
          if [ ! -d "android" ] && [ ! -d "../android" ]; then
            npx cap add android
          fi

      - name: Capacitor Sync
        run: |
          cd frontend
          npx cap sync android

      - name: Locate and Grant Gradle Permissions
        run: |
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            chmod +x "$GRADLE_PATH"
          else
            echo "Gradle wrapper not found"
            exit 1
          fi

      - name: Build Consistent Signed Android APK
        run: |
          GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
          cd "$GRADLE_DIR"
          ./gradlew assembleDebug

      - name: Upload Installable Update APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-Installable
          path: |
            **/build/outputs/apk/debug/app-debug.apk
