name: Build Business Book APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Frontend Dependencies (Enforce Legacy Peer Deps)
        working-directory: frontend
        run: npm install --legacy-peer-deps --force

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync & Initialize Capacitor Android Project
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Ensure Gradle Executable & Wrapper
        working-directory: frontend/android
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Auto-Bump Android Versioning
        working-directory: frontend
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUMBER}"
          echo "Setting Version Code: ${BUILD_NUMBER}, Version Name: ${VERSION_NAME}"
          if [ -d "android/app" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${BUILD_NUMBER}/g" android/app/build.gradle
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" android/app/build.gradle
          fi

      - name: Generate Persistent Dedicated Keystore
        working-directory: frontend/android/app
        run: |
          if [ ! -f "release.keystore" ]; then
            keytool -genkey -v -keystore release.keystore -alias accountbookkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "Neelkanth@2026" -keypass "Neelkanth@2026" -dname "CN=Neelkanth, OU=Accounting, O=Enterprise, L=Hanumangarh, ST=Rajasthan, C=IN"
          fi

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-v1.0.${{ github.run_number }}-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
