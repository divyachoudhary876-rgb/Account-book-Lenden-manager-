          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
name: Build and Distribute Business Book APK

on:
  push:
    branches: [ main ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Clean & Install Dependencies
        working-directory: frontend
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --force

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Capacitor Sync
        working-directory: frontend
        run: |
          if [ ! -f "android/settings.gradle" ]; then
            rm -rf android
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Enforce Monotonic Version Code
        working-directory: frontend/android/app
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          sed -i "s/versionCode [0-9]*/versionCode ${BUILD_NUM}/g" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" build.gradle

      - name: Configure Deterministic Keystore
        working-directory: frontend/android/app
        run: |
          rm -f master_release.keystore
          keytool -genkeypair -v \
            -keystore master_release.keystore \
            -alias businessbook_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -storepass "NeelkanthEnterprise@2026" \
            -keypass "NeelkanthEnterprise@2026" \
            -dname "CN=Neelkanth, OU=Accounting, O=NeelkanthEnterprise, L=Hanumangarh, ST=Rajasthan, C=IN"

      - name: Inject Master Signing into Gradle
        working-directory: frontend/android/app
        run: |
          python3 -c "
          with open('build.gradle', 'r') as f:
              c = f.read()
          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file('master_release.keystore')
                      storePassword 'NeelkanthEnterprise@2026'
                      keyAlias 'businessbook_key'
                      keyPassword 'NeelkanthEnterprise@2026'
                  }
              }
          '''
          if 'signingConfigs {' not in c:
              c = c.replace('android {', 'android {\n' + signing_block)
              c = c.replace('buildTypes {\n        debug {', 'buildTypes {\n        debug {\n            signingConfig signingConfigs.release')
              c = c.replace('buildTypes {\n        release {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release')
              with open('build.gradle', 'w') as f:
                  f.write(c)
          "

      - name: Build Signed APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish In-App Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Business Book Update v1.0.${{ github.run_number }}
          body: "Official in-place update release with accounting core sync, stock CRUD, and print-to-PDF engine."
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
