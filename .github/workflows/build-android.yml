name: Build Business Book APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Clean Conflicting Locks & Install Dependencies
        working-directory: frontend
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --force

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: |
          if [ ! -f "android/settings.gradle" ]; then
            rm -rf android
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Increment Version Code
        working-directory: frontend
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUMBER}"
          echo "Building Version ${VERSION_NAME} (Code: ${BUILD_NUMBER})"
          if [ -d "android/app" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${BUILD_NUMBER}/g" android/app/build.gradle
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" android/app/build.gradle
          fi

      - name: Generate Persistent Dedicated Keystore
        working-directory: frontend/android/app
        run: |
          if [ ! -f "release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias accountbookkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 20000 \
              -storepass "Neelkanth@2026" \
              -keypass "Neelkanth@2026" \
              -dname "CN=Neelkanth, OU=Accounting, O=Enterprise, L=Hanumangarh, ST=Rajasthan, C=IN"
          fi

      - name: Configure Gradle Signing
        working-directory: frontend/android/app
        run: |
          python3 -c "
          with open('build.gradle', 'r') as f:
              c = f.read()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'Neelkanth@2026'
                      keyAlias 'accountbookkey'
                      keyPassword 'Neelkanth@2026'
                  }
              }
          '''
          if 'signingConfigs {' not in c:
              c = c.replace('android {', 'android {' + signing)
              c = c.replace('buildTypes {\n        debug {', 'buildTypes {\n        debug {\n            signingConfig signingConfigs.release')
              c = c.replace('buildTypes {\n        release {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release')
              with open('build.gradle', 'w') as f:
                  f.write(c)
          "

      - name: Grant Gradle Permissions
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Assemble Release Signed APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-v1.0.${{ github.run_number }}-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
