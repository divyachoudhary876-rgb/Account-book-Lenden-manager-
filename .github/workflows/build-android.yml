name: Build Business Book APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps --force

      - name: Auto-Bump Android Versioning
        working-directory: frontend
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUMBER}"
          if [ -d "android/app" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${BUILD_NUMBER}/g" android/app/build.gradle
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" android/app/build.gradle
          fi

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android Folder
        working-directory: frontend
        run: |
          rm -rf android
          npx @capacitor/cli add android
          npx @capacitor/cli sync android

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-v1.0.${{ github.run_number }}-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
