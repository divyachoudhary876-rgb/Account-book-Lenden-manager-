name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --force

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Initialize and Sync Capacitor Android
        working-directory: frontend
        run: |
          # Guarantee @capacitor/android is present
          npm install @capacitor/android@6.1.2 --legacy-peer-deps --force
          
          # Initialize Android native project if not present
          if [ ! -f "android/gradlew" ]; then
            echo "Scaffolding native Android project..."
            rm -rf android
            npx cap add android
          fi
          
          echo "Syncing web assets to native container..."
          npx cap sync android

      - name: Build Android Release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AccountBook-Release-APK
          path: frontend/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
