name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Assemble Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: frontend/package.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Clean Dependency Caches
        run: |
          cd frontend
          npm cache clean --force || true
          rm -rf node_modules package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Fresh Native Android Scaffolding
        run: |
          cd frontend
          # If gradlew does not exist in android folder, wipe the partial dir and re-add cleanly
          if [ ! -f "android/gradlew" ]; then
            echo "Incomplete Android project detected. Re-scaffolding cleanly..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Gradle Permissions & Build Release APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload Verified Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AccountBook-Release-APK
          path: "frontend/android/app/build/outputs/apk/release/*.apk"
          retention-days: 14
