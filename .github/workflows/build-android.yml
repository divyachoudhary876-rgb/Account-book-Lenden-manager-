name: Build Android Release APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 1: Install Dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      # Step 2: Build Web Bundle
      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      # Step 3: Ensure Capacitor Native Platform Sync
      - name: Ensure Capacitor Platform
        working-directory: frontend
        run: |
          if [ ! -f "android/settings.gradle" ]; then
            rm -rf android
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      # Step 4: Grant Executable Permissions
      - name: Grant Executable Permissions
        working-directory: frontend/android
        run: chmod +x gradlew

      # Step 5: Build Debug Signed APK (Ensures Consistent Keystore Fingerprint)
      - name: Build Consistent Android Binary
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      # Step 6: Upload Output APK
      - name: Upload Output APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
