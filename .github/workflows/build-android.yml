name: Build Mobile Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: frontend/package.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Clean Dependency Caches
        run: |
          cd frontend
          npm cache clean --force || true
          rm -rf node_modules package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Fresh Native Android Scaffolding & Sync
        run: |
          cd frontend
          if [ ! -f "android/gradlew" ]; then
            echo "Re-scaffolding Android project..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Decode Keystore from GitHub Secrets
        run: |
          # यह लाइन फिक्स कर दी गई है: फाइल अब सीधे 'app' फोल्डर में सेव होगी
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/my-release-key.jks

      - name: Build Signed Release APK via Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=my-release-key.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Prepare Final APK Artifact
        run: |
          mkdir -p final_apk
          APK_FOUND=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FOUND" ]; then
            echo "Found APK at: $APK_FOUND"
            cp "$APK_FOUND" final_apk/AccountBook-Installable.apk
          else
            echo "CRITICAL: No APK produced."
            exit 1
          fi

      - name: Upload Verified Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AccountBook-APK
          path: final_apk/AccountBook-Installable.apk
          retention-days: 14
