name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build, Sign & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: frontend/package.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Clean Dependency Caches
        run: |
          cd frontend
          npm cache clean --force || true
          rm -rf node_modules package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Fresh Native Android Scaffolding & Sync
        run: |
          cd frontend
          if [ ! -f "android/gradlew" ]; then
            echo "Incomplete Android project detected. Re-scaffolding cleanly..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Release APK via Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Cryptographically Sign Release APK
        run: |
          echo "Generating automated release signing keystore..."
          keytool -genkeypair -v \
            -keystore frontend/release.keystore \
            -alias accountbook \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "AccountBookPass2026" \
            -keypass "AccountBookPass2026" \
            -dname "CN=AccountBook, OU=Finance, O=NeelkanthGroups, L=Jaipur, ST=Rajasthan, C=IN"

          UNSIGNED_APK=$(find frontend/android/app/build/outputs/apk/release -name "*unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi

          echo "Found APK to sign at: $UNSIGNED_APK"

          # Align the APK
          zipalign -v -p 4 "$UNSIGNED_APK" frontend/AccountBook-Aligned.apk

          # Sign with apksigner (v2 & v3 schemes enabled)
          apksigner sign --ks frontend/release.keystore \
            --ks-pass pass:"AccountBookPass2026" \
            --ks-key-alias accountbook \
            --key-pass pass:"AccountBookPass2026" \
            --out frontend/AccountBook-Release.apk \
            frontend/AccountBook-Aligned.apk

          # Verify signature
          apksigner verify --verbose frontend/AccountBook-Release.apk
          echo "APK successfully signed and verified."

      - name: Upload Verified Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AccountBook-Signed-Release-APK
          path: frontend/AccountBook-Release.apk
          retention-days: 14
