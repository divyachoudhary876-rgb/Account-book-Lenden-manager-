name: Build Android Release APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 1: Install Dependencies with Legacy Peer Flag
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      # Step 2: Compile Production Web Bundle
      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      # Step 3: Scaffold Complete Capacitor Android Native Project
      - name: Ensure Capacitor Android Platform
        working-directory: frontend
        run: |
          if [ ! -f "android/settings.gradle" ]; then
            echo "Android directory incomplete or missing. Re-adding Capacitor Android platform..."
            rm -rf android
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      # Step 4: Grant Permissions to Gradle Executable
      - name: Grant Gradle Permissions
        working-directory: frontend/android
        run: chmod +x gradlew

      # Step 5: Assemble Release APK Binary
      - name: Build Android Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease

      # Step 6: Upload Output APK Artifact
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
