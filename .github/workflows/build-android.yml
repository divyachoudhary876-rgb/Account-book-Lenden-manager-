name: Build Android Release APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 1: Clean Install Dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps --force

      # Step 2: Auto-Bump Android Versioning
      - name: Auto-Bump Android Versioning
        working-directory: frontend
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUMBER}"
          echo "Setting Version Code: ${BUILD_NUMBER}, Version Name: ${VERSION_NAME}"
          
          if [ -d "android/app" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${BUILD_NUMBER}/g" android/app/build.gradle
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" android/app/build.gradle
          fi

      # Step 3: Compile Fresh Production Web Bundle
      - name: Build Production Web Bundle
        working-directory: frontend
        run: npm run build

      # Step 4: Force Sync Web Build into Android Assets Native Folder
      - name: Force Capacitor Native Asset Sync
        working-directory: frontend
        run: |
          npx @capacitor/cli copy android
          npx @capacitor/cli sync android

      # Step 5: Build Fresh Android APK
      - name: Assemble Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Step 6: Upload Build Output Artifact
      - name: Upload APK Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccountBook-v1.0.${{ github.run_number }}-release
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
