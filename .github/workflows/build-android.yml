name: Build Android Release APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 1: Install Dependencies with Legacy Flag
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      # Step 2: Build Web Application
      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      # Step 3: Auto-Inject Native Android Platform if Missing
      - name: Ensure Capacitor Android Platform
        run: |
          cd frontend
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      # Step 4: Grant Permissions & Execute Gradle Build
      - name: Grant Gradle Permissions
        run: |
          cd frontend/android
          chmod +x gradlew

      - name: Build Android Release APK
        run: |
          cd frontend/android
          ./gradlew assembleRelease

      # Step 5: Upload Generated Release APK
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
