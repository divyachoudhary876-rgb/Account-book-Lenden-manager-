name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      # -------------------------------------------------------------
      # CAPACITOR ANDROID INITIALIZATION & SYNC
      # -------------------------------------------------------------
      - name: Ensure Android Platform & Capacitor Sync
        run: |
          cd frontend
          if [ ! -d "android" ] || [ ! -f "android/settings.gradle" ]; then
            echo "Initializing Capacitor Android platform..."
            npx cap add android
          fi
          echo "Syncing web assets to native android platform..."
          npx cap sync android

      # -------------------------------------------------------------
      # STATIC DETERMINISTIC KEYSTORE GENERATION (NO FINGERPRINT DRIFT)
      # -------------------------------------------------------------
      - name: Ensure Permanent Release Keystore
        run: |
          cd frontend/android/app
          if [ ! -f "permanent-release.keystore" ]; then
            echo "Generating static release keystore with fixed epoch..."
            keytool -genkeypair -v \
              -keystore permanent-release.keystore \
              -alias accountbookkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -startdate "2024/01/01 00:00:00" \
              -storepass "AccountBookPass2026" \
              -keypass "AccountBookPass2026" \
              -dname "CN=AccountBook, OU=IT, O=Neelkanth, L=Hanumangarh, ST=Rajasthan, C=IN"
          fi

      # -------------------------------------------------------------
      # BUILD SIGNED RELEASE APK VIA GRADLE
      # -------------------------------------------------------------
      - name: Assemble Release APK
        working-directory: frontend/android
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Creating gradle wrapper binary..."
            gradle wrapper
          fi
          chmod +x ./gradlew

          echo "Building signed release APK..."
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
            -Pandroid.injected.signing.store.password=AccountBookPass2026 \
            -Pandroid.injected.signing.key.alias=accountbookkey \
            -Pandroid.injected.signing.key.password=AccountBookPass2026

      # -------------------------------------------------------------
      # ARTIFACT UPLOAD (V4 SPECIFICATION)
      # -------------------------------------------------------------
      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-App
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
