name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend && npm install && cd ..
          else
            npm install
          fi

      - name: Build Web Application
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend && npm run build && cd ..
          else
            npm run build
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor to Android
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend && npx cap sync android && cd ..
          else
            npx cap sync android
          fi

      # -------------------------------------------------------------
      # PERMANENT STATIC KEYSTORE WITH FIXED EPOCH (PREVENTS RE-SIGN CONFLICT)
      # -------------------------------------------------------------
      - name: Ensure Static Release Keystore Exists
        run: |
          TARGET_DIR="android/app"
          if [ -d "frontend/android/app" ]; then
            TARGET_DIR="frontend/android/app"
          fi
          mkdir -p $TARGET_DIR
          cd $TARGET_DIR
          if [ ! -f "permanent-release.keystore" ]; then
            echo "Generating static release keystore with fixed epoch..."
            keytool -genkeypair -v \
              -keystore permanent-release.keystore \
              -alias accountbookkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -startdate "2024/01/01 00:00:00" \
              -storepass "AccountBookPass2026" \
              -keypass "AccountBookPass2026" \
              -dname "CN=AccountBook, OU=IT, O=Neelkanth, L=Hanumangarh, ST=Rajasthan, C=IN"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -d "frontend/android" ]; then
            cd frontend/android && chmod +x ./gradlew || true
          else
            cd android && chmod +x ./gradlew || true
          fi

      - name: Build Signed Release APK
        run: |
          if [ -d "frontend/android" ]; then
            cd frontend/android
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
              -Pandroid.injected.signing.store.password=AccountBookPass2026 \
              -Pandroid.injected.signing.key.alias=accountbookkey \
              -Pandroid.injected.signing.key.password=AccountBookPass2026
          else
            cd android
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
              -Pandroid.injected.signing.store.password=AccountBookPass2026 \
              -Pandroid.injected.signing.key.alias=accountbookkey \
              -Pandroid.injected.signing.key.password=AccountBookPass2026
          fi

      # -------------------------------------------------------------
      # UPDATED TO V4 (FIXES GITHUB DEPRECATION ERROR #354)
      # -------------------------------------------------------------
      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-App
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 7
