name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor to Android
        run: |
          npx cap sync android

      # -------------------------------------------------------------
      # PERMANENT STATIC KEYSTORE WITH FIXED STARTDATE EPOCH
      # Deterministic startdate ensures identical SHA-256 fingerprint across all runs
      # -------------------------------------------------------------
      - name: Generate Static Deterministic Keystore
        run: |
          mkdir -p android/app
          cd android/app
          if [ ! -f "permanent-release.keystore" ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v \
              -keystore permanent-release.keystore \
              -alias accountbookkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -startdate "2024/01/01 00:00:00" \
              -storepass "AccountBookPass2026" \
              -keypass "AccountBookPass2026" \
              -dname "CN=AccountBook, OU=IT, O=Neelkanth, L=Hanumangarh, ST=Rajasthan, C=IN"
          fi
          cd ../..

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x ./gradlew || true

      - name: Build Signed APK via Gradle
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
            -Pandroid.injected.signing.store.password=AccountBookPass2026 \
            -Pandroid.injected.signing.key.alias=accountbookkey \
            -Pandroid.injected.signing.key.password=AccountBookPass2026
          cd ..

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Android-APK-App
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
