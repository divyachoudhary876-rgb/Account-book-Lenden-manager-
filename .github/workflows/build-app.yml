name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      # -------------------------------------------------------------
      # ONLY SYNC CAPACITOR ASSETS
      # -------------------------------------------------------------
      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      # -------------------------------------------------------------
      # LOCATE REAL ANDROID DIR & ENSURE KEYSTORE
      # -------------------------------------------------------------
      - name: Prepare Keystore and Target Path
        id: setup-target
        run: |
          if [ -d "frontend/android/app" ]; then
            TARGET="frontend/android"
          elif [ -d "android/app" ]; then
            TARGET="android"
          else
            TARGET=$(find . -name "build.gradle" -not -path "*/node_modules/*" | grep "/app/" | head -n 1 | sed 's#/app/build.gradle##')
          fi
          echo "Target directory is: $TARGET"
          echo "target_dir=$TARGET" >> $GITHUB_OUTPUT

          mkdir -p "$TARGET/app"
          cd "$TARGET/app"
          if [ ! -f "permanent-release.keystore" ]; then
            echo "Generating static release keystore..."
            keytool -genkeypair -v \
              -keystore permanent-release.keystore \
              -alias accountbookkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -startdate "2024/01/01 00:00:00" \
              -storepass "AccountBookPass2026" \
              -keypass "AccountBookPass2026" \
              -dname "CN=AccountBook, OU=IT, O=Neelkanth, L=Hanumangarh, ST=Rajasthan, C=IN"
          fi

      # -------------------------------------------------------------
      # BUILD SIGNED RELEASE APK (NATIVE GRADLE DIRECT EXECUTION)
      # -------------------------------------------------------------
      - name: Assemble Release APK
        run: |
          TARGET="${{ steps.setup-target.outputs.target_dir }}"
          cd "$TARGET"
          echo "Running build inside: $(pwd)"

          # Generate gradle wrapper if missing
          if [ ! -f "gradlew" ]; then
            echo "Generating wrapper via gradle CLI..."
            gradle wrapper || true
          fi
          chmod +x ./gradlew || true

          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
              -Pandroid.injected.signing.store.password=AccountBookPass2026 \
              -Pandroid.injected.signing.key.alias=accountbookkey \
              -Pandroid.injected.signing.key.password=AccountBookPass2026
          else
            gradle assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
              -Pandroid.injected.signing.store.password=AccountBookPass2026 \
              -Pandroid.injected.signing.key.alias=accountbookkey \
              -Pandroid.injected.signing.key.password=AccountBookPass2026
          fi

      # -------------------------------------------------------------
      # UPLOAD ARTIFACT V4
      # -------------------------------------------------------------
      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-App
          path: |
            **/build/outputs/apk/release/*.apk
          retention-days: 7
