name: Build Cross-Platform App (Android & Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Generate Android Platform & Sync
        run: |
          cd frontend
          rm -rf android
          npx @capacitor/cli add android
          npx @capacitor/cli sync android
          if [ ! -f "android/gradlew" ]; then
            npm install @capacitor/android
            npx cap sync android
          fi

      # ----------------------------------------------------------------------------------
      # FIXED: PERMANENT STATIC KEYSTORE WITH FIXED VALIDITY SEED (NEVER REGENERATES RANDOM KEY)
      # ----------------------------------------------------------------------------------
      - name: Setup Fixed Deterministic Keystore
        run: |
          cd frontend/android/app
          # Remove any previous temp keystores
          rm -f permanent-release.keystore
          # Generate with fixed parameters
          keytool -genkeypair -v \
            -keystore permanent-release.keystore \
            -alias accountbookkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 \
            -storepass "AccountBookPass2026" \
            -keypass "AccountBookPass2026" \
            -dname "CN=AccountBook, OU=IT, O=Neelkanth, L=Hanumangarh, ST=Rajasthan, C=IN"

      # -------------------------------------------------------------
      # BUILD SIGNED RELEASE APK VIA OFFICIAL GRADLEW
      # -------------------------------------------------------------
      - name: Build Signed APK via Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
            -Pandroid.injected.signing.store.password=AccountBookPass2026 \
            -Pandroid.injected.signing.key.alias=accountbookkey \
            -Pandroid.injected.signing.key.password=AccountBookPass2026 \
            --no-daemon

      - name: Prepare Android APK Artifact
        run: |
          mkdir -p android_artifact
          APK_FOUND=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FOUND" ]; then
            cp "$APK_FOUND" android_artifact/AccountBook-Installable.apk
          else
            APK_FALLBACK=$(find frontend/android/app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$APK_FALLBACK" android_artifact/AccountBook-Installable.apk
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-App
          path: android_artifact/
          retention-days: 14

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Electron Builder
        run: |
          cd frontend
          npm install
          npm install electron electron-builder --save-dev

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Build Windows Executable (.exe)
        run: |
          cd frontend
          npx electron-builder --win --x64

      - name: Upload Windows App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE-App
          path: frontend/release-builds/*.exe
          retention-days: 14
