name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend && npm install && cd ..
          elif [ -f "package.json" ]; then
            npm install
          fi

      - name: Build Web Application
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend && npm run build && cd ..
          elif [ -f "package.json" ]; then
            npm run build
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Runtime
        uses: gradle/actions/setup-gradle@v3

      # -------------------------------------------------------------
      # CAPACITOR PLATFORM INITIALIZATION & SYNC
      # -------------------------------------------------------------
      - name: Initialize & Sync Capacitor Android
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend
            if [ ! -d "android" ]; then
              npx cap add android || true
            fi
            npx cap sync android
            cd ..
          else
            if [ ! -d "android" ]; then
              npx cap add android || true
            fi
            npx cap sync android
          fi

      # -------------------------------------------------------------
      # DETECT ACTIVE ANDROID DIRECTORY & GUARANTEE GRADLEW WRAPPER
      # -------------------------------------------------------------
      - name: Ensure Complete Gradle Wrapper Exists
        run: |
          ANDROID_DIR=""
          if [ -d "frontend/android" ]; then
            ANDROID_DIR="frontend/android"
          elif [ -d "android" ]; then
            ANDROID_DIR="android"
          fi

          if [ -z "$ANDROID_DIR" ]; then
            echo "Error: Android project directory not found!"
            exit 1
          fi

          cd "$ANDROID_DIR"
          if [ ! -f "gradlew" ]; then
            echo "Generating missing gradle wrapper..."
            gradle wrapper || true
          fi
          chmod +x gradlew || true
          cd - > /dev/null

      # -------------------------------------------------------------
      # PERMANENT STATIC KEYSTORE WITH FIXED EPOCH (NO SIGNATURE CLASH)
      # -------------------------------------------------------------
      - name: Ensure Static Release Keystore Exists
        run: |
          TARGET_DIR="android/app"
          if [ -d "frontend/android/app" ]; then
            TARGET_DIR="frontend/android/app"
          fi
          mkdir -p "$TARGET_DIR"
          cd "$TARGET_DIR"
          if [ ! -f "permanent-release.keystore" ]; then
            echo "Generating persistent static release keystore..."
            keytool -genkeypair -v \
              -keystore permanent-release.keystore \
              -alias accountbookkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -startdate "2024/01/01 00:00:00" \
              -storepass "AccountBookPass2026" \
              -keypass "AccountBookPass2026" \
              -dname "CN=AccountBook, OU=IT, O=Neelkanth, L=Hanumangarh, ST=Rajasthan, C=IN"
          fi

      # -------------------------------------------------------------
      # BUILD SIGNED RELEASE APK
      # -------------------------------------------------------------
      - name: Build Signed Release APK
        run: |
          ANDROID_DIR=""
          if [ -d "frontend/android" ]; then
            ANDROID_DIR="frontend/android"
          elif [ -d "android" ]; then
            ANDROID_DIR="android"
          fi

          cd "$ANDROID_DIR"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
            -Pandroid.injected.signing.store.password=AccountBookPass2026 \
            -Pandroid.injected.signing.key.alias=accountbookkey \
            -Pandroid.injected.signing.key.password=AccountBookPass2026

      # -------------------------------------------------------------
      # UPLOAD ARTIFACT V4
      # -------------------------------------------------------------
      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-App
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 7
