name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend && npm install && cd ..
          elif [ -f "package.json" ]; then
            npm install
          fi

      - name: Build Web Application
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend && npm run build && cd ..
          elif [ -f "package.json" ]; then
            npm run build
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Runtime
        uses: gradle/actions/setup-gradle@v3

      # -------------------------------------------------------------
      # COMPLETE CAPACITOR PLATFORM GUARANTEE & SYNC
      # -------------------------------------------------------------
      - name: Ensure Android Platform & Settings Exist
        run: |
          WORKDIR="."
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            WORKDIR="frontend"
          fi
          cd "$WORKDIR"

          echo "Checking capacitor android platform in $(pwd)..."
          # Ensure android platform is added if settings.gradle is absent
          if [ ! -f "android/settings.gradle" ] && [ ! -f "../android/settings.gradle" ]; then
            echo "Android platform missing or incomplete. Adding fresh android platform..."
            npx cap add android || true
          fi

          echo "Syncing web assets to android..."
          npx cap sync android

      # -------------------------------------------------------------
      # SETUP STATIC DETERMINISTIC RELEASE KEYSTORE
      # -------------------------------------------------------------
      - name: Setup Keystore & Signing Environment
        id: prep-build
        run: |
          TARGET_DIR=""
          if [ -d "frontend/android/app" ]; then
            TARGET_DIR="frontend/android"
          elif [ -d "android/app" ]; then
            TARGET_DIR="android"
          else
            TARGET_DIR=$(find . -type d -name "app" | head -n 1 | sed 's#/app##')
          fi

          if [ -z "$TARGET_DIR" ]; then
            echo "Critical Error: Android app module could not be determined!"
            exit 1
          fi

          echo "Target build directory: $TARGET_DIR"
          echo "target_dir=$TARGET_DIR" >> $GITHUB_OUTPUT

          mkdir -p "$TARGET_DIR/app"
          cd "$TARGET_DIR/app"

          if [ ! -f "permanent-release.keystore" ]; then
            echo "Generating static release keystore with fixed epoch..."
            keytool -genkeypair -v \
              -keystore permanent-release.keystore \
              -alias accountbookkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -startdate "2024/01/01 00:00:00" \
              -storepass "AccountBookPass2026" \
              -keypass "AccountBookPass2026" \
              -dname "CN=AccountBook, OU=IT, O=Neelkanth, L=Hanumangarh, ST=Rajasthan, C=IN"
          fi

      # -------------------------------------------------------------
      # BUILD SIGNED RELEASE APK
      # -------------------------------------------------------------
      - name: Assemble Release APK
        run: |
          TARGET_DIR="${{ steps.prep-build.outputs.target_dir }}"
          cd "$TARGET_DIR"

          # Ensure gradlew executable exists
          if [ ! -f "./gradlew" ]; then
            echo "Generating gradle wrapper binary..."
            gradle wrapper || true
          fi
          chmod +x ./gradlew || true

          echo "Executing release build in $(pwd)..."
          if [ -x "./gradlew" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
              -Pandroid.injected.signing.store.password=AccountBookPass2026 \
              -Pandroid.injected.signing.key.alias=accountbookkey \
              -Pandroid.injected.signing.key.password=AccountBookPass2026
          else
            gradle assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
              -Pandroid.injected.signing.store.password=AccountBookPass2026 \
              -Pandroid.injected.signing.key.alias=accountbookkey \
              -Pandroid.injected.signing.key.password=AccountBookPass2026
          fi

      # -------------------------------------------------------------
      # UPLOAD ARTIFACT V4
      # -------------------------------------------------------------
      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-App
          path: |
            **/build/outputs/apk/release/*.apk
          retention-days: 7
