name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Runtime
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor to Android
        run: |
          cd frontend
          npx cap sync android

      # -------------------------------------------------------------
      # ENSURE FIXED PERMANENT RELEASE KEYSTORE (NO SIGNATURE MISMATCH)
      # -------------------------------------------------------------
      - name: Guarantee Static Keystore
        run: |
          cd frontend/android/app
          if [ ! -f "permanent-release.keystore" ]; then
            echo "Creating permanent static keystore..."
            keytool -genkeypair -v \
              -keystore permanent-release.keystore \
              -alias accountbookkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -startdate "2024/01/01 00:00:00" \
              -storepass "AccountBookPass2026" \
              -keypass "AccountBookPass2026" \
              -dname "CN=AccountBook, OU=IT, O=Neelkanth, L=Hanumangarh, ST=Rajasthan, C=IN"
          fi

      # -------------------------------------------------------------
      # DIRECT GRADLE EXECUTION (ZERO EXIT CODE 127 ISSUES)
      # -------------------------------------------------------------
      - name: Build Release APK via Gradle
        working-directory: frontend/android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
              -Pandroid.injected.signing.store.password=AccountBookPass2026 \
              -Pandroid.injected.signing.key.alias=accountbookkey \
              -Pandroid.injected.signing.key.password=AccountBookPass2026
          else
            echo "Running direct gradle tool..."
            gradle assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
              -Pandroid.injected.signing.store.password=AccountBookPass2026 \
              -Pandroid.injected.signing.key.alias=accountbookkey \
              -Pandroid.injected.signing.key.password=AccountBookPass2026
          fi

      # -------------------------------------------------------------
      # UPLOAD ARTIFACT V4 (NO DEPRECATION ERROR)
      # -------------------------------------------------------------
      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-App
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
