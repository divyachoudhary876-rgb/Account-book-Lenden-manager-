name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android Platform
        run: |
          cd frontend
          npx cap sync android

      # -------------------------------------------------------------
      # PERMANENT STATIC KEYSTORE WITH FIXED EPOCH (PREVENTS RE-SIGN CONFLICT)
      # -------------------------------------------------------------
      - name: Setup Deterministic Keystore
        run: |
          cd frontend/android/app
          if [ ! -f "permanent-release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore permanent-release.keystore \
              -alias accountbookkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -startdate "2024/01/01 00:00:00" \
              -storepass "AccountBookPass2026" \
              -keypass "AccountBookPass2026" \
              -dname "CN=AccountBook, OU=IT, O=Neelkanth, L=Hanumangarh, ST=Rajasthan, C=IN"
          fi

      # -------------------------------------------------------------
      # NATIVE ANDROID WRAPPER ASSEMBLY (ZERO EXTERNAL GRADLE CLI OVERHEAD)
      # -------------------------------------------------------------
      - name: Build Release APK via Gradlew
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/permanent-release.keystore \
            -Pandroid.injected.signing.store.password=AccountBookPass2026 \
            -Pandroid.injected.signing.key.alias=accountbookkey \
            -Pandroid.injected.signing.key.password=AccountBookPass2026

      # -------------------------------------------------------------
      # UPLOAD ARTIFACT V4
      # -------------------------------------------------------------
      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-App
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
