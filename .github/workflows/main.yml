name: Build Business Book APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. Install Dependencies & Capacitor
      - name: Install Dependencies
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 2. Build Web Assets
      - name: Build Web Assets
        run: npm run build --if-present

      # 3. Auto-Add Android Platform if gradlew is missing
      - name: Ensure Android Native Project Exists
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Android folder missing. Initializing Capacitor Android..."
            npx cap init "BusinessBook" "com.neelkanth.businessbook" --web-dir dist || true
            npx cap add android
          fi
          npx cap sync android

      # 4. Build Release APK
      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # 5. Upload APK Artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
