name: Build Business Book APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js v18
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install Dependencies from root
      - name: Install Dependencies
        run: npm install

      # 4. Build Frontend Web Assets
      - name: Build Web Frontend
        run: npm run build --if-present

      # 5. Sync Capacitor Android (if Capacitor exists in root)
      - name: Sync Capacitor Android
        run: npx cap sync android --no-build || echo "Capacitor sync skipped"

      # 6. Setup Java JDK for Android Compilation
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 7. Build Android Release APK
      - name: Build Android Release APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          elif [ -d "frontend/android" ]; then
            cd frontend/android
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Android directory not found!" && exit 1
          fi

      # 8. Upload Build Artifact (v4)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-Release-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/apk/release/*.apk
