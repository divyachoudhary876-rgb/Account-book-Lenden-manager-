name: Build Business Book APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 1. Dynamic Dependency Installation
      - name: Install Dependencies
        run: |
          PACKAGE_PATH=$(find . -maxdepth 3 -name "package.json" | head -n 1)
          if [ -n "$PACKAGE_PATH" ]; then
            TARGET_DIR=$(dirname "$PACKAGE_PATH")
            echo "Installing dependencies in $TARGET_DIR"
            cd "$TARGET_DIR" && npm install
          else
            echo "Creating fallback package.json..."
            npm init -y
            npm install
          fi

      # 2. Build Frontend Static Assets
      - name: Build Web Assets
        run: |
          PACKAGE_PATH=$(find . -maxdepth 3 -name "package.json" | head -n 1)
          if [ -n "$PACKAGE_PATH" ]; then
            TARGET_DIR=$(dirname "$PACKAGE_PATH")
            cd "$TARGET_DIR" && npm run build --if-present
          fi

      # 3. Setup Java JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Locate 'gradlew' dynamically and Build APK
      - name: Build Android Release APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            ANDROID_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found Android wrapper at $ANDROID_DIR"
            cd "$ANDROID_DIR"
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "ERROR: Could not find 'gradlew' file in any folder!" && exit 1
          fi

      # 5. Upload Generated APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-Release-APK
          path: "**/app/build/outputs/apk/release/*.apk"
