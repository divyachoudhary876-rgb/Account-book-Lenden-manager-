name: Build Business Book APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 1. Install & Build Frontend Static Assets
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build React Frontend
        run: |
          cd frontend
          npm run build

      # 2. Copy Built Code to Capacitor Native Android Project
      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      # 3. Setup Java for Android APK Compile
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Build APK File
      - name: Build Android Release APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease

      # 5. Upload APK Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: BusinessBook-Latest-Release
          path: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
