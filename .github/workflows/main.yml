name: Build Business Book APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs='-Xmx2048m'"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup Node.js v22
      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Setup Java JDK 21
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 3. Clean Runner Caches
      - name: Clean Caches
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      # 4. Locate Project Working Directory & Install Dependencies
      - name: Install Dependencies
        run: |
          PKG_PATH=$(find . -maxdepth 4 -name "package.json" | grep -v "node_modules" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            WORK_DIR=$(dirname "$PKG_PATH")
          else
            WORK_DIR="."
            npm init -y
          fi
          echo "WORK_DIR=$WORK_DIR" >> $GITHUB_ENV
          echo "Target project directory resolved to: $WORK_DIR"
          cd "$WORK_DIR"
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npm install

      # 5. Compile Real Frontend Web Assets
      - name: Build Web Application Bundle
        run: |
          cd "${{ env.WORK_DIR }}"
          
          # Execute project build script
          npm run build --if-present || true

          # Consolidate output into dist/ for Capacitor sync
          if [ -d "build" ] && [ ! -d "dist" ]; then
            cp -r build dist
          elif [ -d "out" ] && [ ! -d "dist" ]; then
            cp -r out dist
          elif [ -d "public" ] && [ ! -d "dist" ]; then
            mkdir -p dist
            cp -r public/* dist/
          fi

          # Safe fallback to root assets if compilation output directory absent
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            mkdir -p dist
            find . -maxdepth 2 -name "*.html" -exec cp {} dist/ \; 2>/dev/null || true
            find . -maxdepth 2 -name "*.js" -exec cp {} dist/ \; 2>/dev/null || true
            find . -maxdepth 2 -name "*.css" -exec cp {} dist/ \; 2>/dev/null || true
          fi

      # 6. Capacitor Android Native Project Sync
      - name: Synchronize Capacitor Native Android
        run: |
          cd "${{ env.WORK_DIR }}"

          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap init "BusinessBook" "com.neelkanth.businessbook" --web-dir "dist" || true
            npx cap add android
          fi
          npx cap sync android

      # 7. Grant Permissions
      - name: Grant Gradle Permissions
        run: |
          GRADLEW_PATH=$(find . -maxdepth 5 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            cd $(dirname "$GRADLEW_PATH")
            chmod +x gradlew
          fi

      # 8. Compile Release APK Binary
      - name: Build Android Release APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 5 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            cd $(dirname "$GRADLEW_PATH")
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "ERROR: Gradle wrapper execution file not found!" && exit 1
          fi

      # 9. Cryptographically Sign APK Binary (V2/V3 Android Security Scheme)
      - name: Sign APK Binary
        run: |
          UNSIGNED_APK=$(find . -name "*release*.apk" | grep -v "unaligned" | head -n 1)
          keytool -genkeypair -v -keystore release.keystore -alias businessbook -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Neelkanth, OU=Accounting, O=BusinessBook, L=Jaipur, ST=Rajasthan, C=IN"
          ANDROID_BUILD_TOOLS=$(find $ANDROID_HOME/build-tools/ -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          
          $ANDROID_BUILD_TOOLS/zipalign -v 4 "$UNSIGNED_APK" BusinessBook-Signed.apk
          $ANDROID_BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:password123 --key-pass pass:password123 --out BusinessBook-Installable.apk BusinessBook-Signed.apk

      # 10. Upload Final Installable Artifact
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-Signed-APK
          path: BusinessBook-Installable.apk
