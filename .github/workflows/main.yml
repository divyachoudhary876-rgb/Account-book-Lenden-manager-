name: Build Business Book APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Updated Checkout Action (v4)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js (v4)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install & Build Frontend Static Assets
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build React Frontend
        run: |
          cd frontend
          npm run build

      # 4. Sync Capacitor Native Android Project
      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      # 5. Setup Java JDK (v4)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 6. Build Android Release APK
      - name: Build Android Release APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease

      # 7. Upload APK Artifact (Updated to v4)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-Release-APK
          path: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
