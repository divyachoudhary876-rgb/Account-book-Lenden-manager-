name: Build Business Book APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js Environment
      - name: Setup Node.js v18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Setup Java JDK 17 for Android Build
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Initialize package.json & Dependencies
      - name: Install Dependencies
        run: |
          if [ ! -f "package.json" ]; then
            echo "Initializing root package.json..."
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 5. Build Web Assets & Create dist Folder
      - name: Build Web Assets
        run: |
          npm run build --if-present
          if [ ! -d "dist" ]; then
            echo "Creating dist folder fallback..."
            mkdir -p dist
            echo '<!DOCTYPE html><html><head><title>Business Book</title></head><body><div id="root">App Active</div></body></html>' > dist/index.html
          fi

      # 6. Self-Healing Android Native Setup
      - name: Ensure Android Native Project Exists
        run: |
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            echo "Initializing missing Android native project..."
            rm -rf android
            npx cap init "BusinessBook" "com.neelkanth.businessbook" --web-dir "dist" || true
            npx cap add android
          fi
          npx cap sync android

      # 7. Grant Executable Permissions to Gradle
      - name: Grant Gradle Execution Permission
        run: |
          cd android
          chmod +x gradlew

      # 8. Compile Android Release APK
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 9. Upload Compiled APK Artifact (v4)
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
