name: Build Business Book APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js v18
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Locate package.json dynamically and Install Dependencies
      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            echo "Found package.json in root"
            npm install
          elif [ -f "account-book/package.json" ]; then
            echo "Found package.json in account-book"
            cd account-book && npm install
          elif [ -f "frontend/package.json" ]; then
            echo "Found package.json in frontend"
            cd frontend && npm install
          else
            echo "ERROR: package.json not found in repository!" && exit 1
          fi

      # 4. Build Web Frontend Assets
      - name: Build Web Frontend
        run: |
          if [ -f "package.json" ]; then
            npm run build --if-present
          elif [ -f "account-book/package.json" ]; then
            cd account-book && npm run build --if-present
          elif [ -f "frontend/package.json" ]; then
            cd frontend && npm run build --if-present
          fi

      # 5. Setup Java JDK 17 for Android Build
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 6. Locate Android Project and Build Release APK
      - name: Build Android Release APK
        run: |
          ANDROID_DIR=$(find . -maxdepth 3 -type d -name "android" | head -n 1)
          if [ -n "$ANDROID_DIR" ]; then
            echo "Building APK in $ANDROID_DIR"
            cd "$ANDROID_DIR"
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "ERROR: android folder not found in repository!" && exit 1
          fi

      # 7. Upload Release Artifact (v4)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-Release-APK
          path: |
            **/android/app/build/outputs/apk/release/*.apk
