name: Build Business Book APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs='-Xmx2048m'"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Node.js v22
      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Setup Java JDK 21
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 3. Clean Runner Caches
      - name: Clean Gradle Caches
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      # 4. Safe Directory Discovery & Install Node Dependencies
      - name: Install Node Dependencies
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" | grep -v "node_modules" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            TARGET_DIR=$(dirname "$PKG_PATH")
          else
            TARGET_DIR="."
            npm init -y
          fi
          echo "Target Directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npm install

      # 5. Dynamic Web Application Asset Assembly
      - name: Build Web Application
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" | grep -v "node_modules" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            TARGET_DIR=$(dirname "$PKG_PATH")
          else
            TARGET_DIR="."
          fi
          cd "$TARGET_DIR"

          # Execute build script if defined
          npm run build --if-present

          # Consolidate existing framework outputs into 'dist'
          if [ -d "build" ] && [ ! -d "dist" ]; then
            cp -r build dist
          elif [ -d "out" ] && [ ! -d "dist" ]; then
            cp -r out dist
          elif [ -d "public" ] && [ ! -d "dist" ]; then
            mkdir -p dist
            cp -r public/* dist/
          fi

          # Fallback: Copy repository root assets if no dist folder exists yet
          if [ ! -d "dist" ]; then
            echo "No framework build output found. Syncing repository source files to dist..."
            mkdir -p dist
            rsync -av --exclude='node_modules' --exclude='android' --exclude='.git' . dist/ || cp -r *.html *.js *.css dist/ 2>/dev/null || true
          fi

          # Absolute Fallback: Ensure index.html exists
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>Business Book</title></head><body><div id="root">App Loaded</div></body></html>' > dist/index.html
          fi

      # 6. Capacitor Android Synchronization
      - name: Synchronize Native Capacitor Android
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" | grep -v "node_modules" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            TARGET_DIR=$(dirname "$PKG_PATH")
          else
            TARGET_DIR="."
          fi
          cd "$TARGET_DIR"

          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap init "BusinessBook" "com.neelkanth.businessbook" --web-dir "dist" || true
            npx cap add android
          fi
          npx cap sync android

      # 7. Grant Gradle Permissions
      - name: Grant Gradle Permissions
        run: |
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            cd $(dirname "$GRADLEW_PATH")
            chmod +x gradlew
          fi

      # 8. Build Release APK Binary
      - name: Build Android Release APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            cd $(dirname "$GRADLEW_PATH")
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "ERROR: Gradlew wrapper not found!" && exit 1
          fi

      # 9. Sign APK Binary for Android OS Installation
      - name: Sign APK Binary
        run: |
          UNSIGNED_APK=$(find . -name "*release*.apk" | grep -v "unaligned" | head -n 1)
          keytool -genkeypair -v -keystore release.keystore -alias businessbook -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Neelkanth, OU=Accounting, O=BusinessBook, L=Jaipur, ST=Rajasthan, C=IN"
          ANDROID_BUILD_TOOLS=$(find $ANDROID_HOME/build-tools/ -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          
          $ANDROID_BUILD_TOOLS/zipalign -v 4 "$UNSIGNED_APK" BusinessBook-Signed.apk
          $ANDROID_BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:password123 --key-pass pass:password123 --out BusinessBook-Installable.apk BusinessBook-Signed.apk

      # 10. Upload Final Installable Artifact
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-Signed-APK
          path: BusinessBook-Installable.apk
