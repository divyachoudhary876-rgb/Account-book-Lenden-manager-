name: Build Business Book APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs='-Xmx2048m'"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Node.js v22
      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Setup Java JDK 21 (Matches Capacitor 7 source target release 21)
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 3. Clear Gradle Caches
      - name: Clean Gradle Caches
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      # 4. Install Dependencies
      - name: Install Node Dependencies
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      # 5. Build Web Assets
      - name: Build Web Assets
        run: |
          npm run build --if-present
          if [ ! -d "dist" ]; then
            mkdir -p dist
            echo '<!DOCTYPE html><html><head><title>Business Book</title></head><body><div id="root">App Active</div></body></html>' > dist/index.html
          fi

      # 6. Synchronize Native Android Project
      - name: Ensure Android Native Project Exists
        run: |
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap init "BusinessBook" "com.neelkanth.businessbook" --web-dir "dist" || true
            npx cap add android
          fi
          npx cap sync android

      # 7. Grant Permissions
      - name: Grant Gradle Execution Permission
        run: |
          cd android
          chmod +x gradlew

      # 8. Compile Android Release APK
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 9. Upload Release Artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessBook-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
