<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <title>Backup Cleaner - Neelkanth Int Udyog</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; background: #f8fafc; color: #0f172a; }
    .box { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #cbd5e1; }
    button { margin-top: 14px; padding: 10px 18px; background: #059669; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    pre { background: #f1f5f9; padding: 12px; border-radius: 8px; overflow: auto; }
  </style>
</head>
<body>
  <div class="box">
    <h2>बैकअप फ़ाइल साफ़ करें</h2>
    <p>अपनी <b>Neelkanth_Int_Udyog_Backup_2026-11-23.json</b> फ़ाइल चुनें:</p>
    <input type="file" id="fileInput" accept=".json" />
    <br />
    <button id="cleanBtn">Clean & Download JSON</button>
    <pre id="status">फ़ाइल चुनने की प्रतीक्षा है...</pre>
  </div>

  <script>
    const TARGET_FIRM_ID = 'FIRM-1790909076433';

    document.getElementById('cleanBtn').addEventListener('click', () => {
      const file = document.getElementById('fileInput').files[0];
      const statusEl = document.getElementById('status');
      if (!file) {
        statusEl.textContent = 'कृपया पहले बैकअप JSON फ़ाइल चुनें।';
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const srcData = parsed.data || {};

          const voucherMap = new Map();
          const purchaseBillMap = new Map();
          const accountMap = new Map();
          const stockMap = new Map();

          for (const [key, val] of Object.entries(srcData)) {
            if (!Array.isArray(val)) continue;

            if (
              key.startsWith('account_book_vouchers_') ||
              key.startsWith('app_vouchers_') ||
              key.startsWith('sales_invoices_') ||
              key === 'app_invoices'
            ) {
              val.forEach((v) => {
                if (!v || typeof v !== 'object') return;
                const vid = String(v.id || v.reference_no || v.voucher_number || '').trim();
                if (!vid) return;
                const normalizedV = { ...v, firm_id: TARGET_FIRM_ID, firmId: TARGET_FIRM_ID };
                if (!voucherMap.has(vid)) voucherMap.set(vid, normalizedV);

                if (String(v.voucher_type || v.type || '').toUpperCase() === 'PURCHASE') {
                  const bKey = String(v.bill_number || v.reference_no || v.voucher_number || vid).trim();
                  if (bKey && !purchaseBillMap.has(bKey)) {
                    purchaseBillMap.set(bKey, { ...normalizedV, bill_number: bKey, reference_no: bKey });
                  }
                }
              });
            }

            if (key.startsWith('purchase_bills_')) {
              val.forEach((b) => {
                if (!b || typeof b !== 'object') return;
                const bKey = String(b.bill_number || b.reference_no || b.id || '').trim();
                if (!bKey) return;
                const normalizedB = { ...b, firm_id: TARGET_FIRM_ID, firmId: TARGET_FIRM_ID, bill_number: bKey, reference_no: bKey };
                if (!purchaseBillMap.has(bKey)) purchaseBillMap.set(bKey, normalizedB);

                const vid = String(b.id || `PURCH-${bKey}`).trim();
                if (!voucherMap.has(vid)) {
                  voucherMap.set(vid, {
                    ...normalizedB,
                    id: vid,
                    voucher_type: b.voucher_type || 'PURCHASE',
                    type: b.type || 'PURCHASE',
                  });
                }
              });
            }

            if (
              key.startsWith('account_heads_') ||
              key.startsWith('app_accounts_') ||
              key === 'app_account_heads'
            ) {
              val.forEach((acc) => {
                if (!acc || typeof acc !== 'object') return;
                const accName = String(acc.account_name || acc.name || '').trim();
                const accKey = accName.toLowerCase() || String(acc.id || '').trim();
                if (!accKey) return;
                const cleanBalType =
                  acc.balance_type && String(acc.balance_type).trim()
                    ? String(acc.balance_type).trim()
                    : acc.balanceType && String(acc.balanceType).trim()
                      ? String(acc.balanceType).trim()
                      : 'Dr';

                if (!accountMap.has(accKey)) {
                  accountMap.set(accKey, {
                    ...acc,
                    name: acc.name || accName,
                    account_name: acc.account_name || accName,
                    balance_type: cleanBalType,
                    balanceType: cleanBalType,
                  });
                }
              });
            }

            if (key.startsWith('app_stock_') || key.startsWith('inventory_items_')) {
              val.forEach((item) => {
                if (!item || typeof item !== 'object') return;
                const itemName = String(item.item_name || item.name || item.itemName || '').trim();
                const itemKey = itemName.toLowerCase() || String(item.id || '').trim();
                if (!itemKey) return;
                if (!stockMap.has(itemKey)) {
                  stockMap.set(itemKey, {
                    ...item,
                    firm_id: TARGET_FIRM_ID,
                    name: item.name || itemName,
                    item_name: item.item_name || itemName,
                  });
                }
              });
            }
          }

          const mergedVouchers = Array.from(voucherMap.values());
          const mergedBills = Array.from(purchaseBillMap.values());
          const mergedAccounts = Array.from(accountMap.values());
          const mergedStock = Array.from(stockMap.values());

          const cleanFirmProfile = {
            id: TARGET_FIRM_ID,
            firm_id: TARGET_FIRM_ID,
            legal_name: 'Neelkanth Int Udyog',
            trade_name: 'Neelkanth Int Udyog',
            category: 'BRICK_KILN',
            business_category: 'BRICK_KILN',
            businessCategory: 'BRICK_KILN',
            gstin: 'UNREGISTERED',
            phone: '',
            address: '',
          };

          const fyList = [
            { id: 'FY-2026-27', label: 'FY 2026-27', startDate: '2026-04-01', endDate: '2027-03-31', isLocked: false },
            { id: 'FY-2025-26', label: 'FY 2025-26', startDate: '2025-04-01', endDate: '2026-03-31', isLocked: false },
          ];

          const cleanedOutput = {
            meta: {
              ...(parsed.meta || {}),
              active_firm_id: TARGET_FIRM_ID,
              cleaned_at: new Date().toISOString(),
            },
            stats: {
              vouchersCount: mergedVouchers.length,
              purchaseBillsCount: mergedBills.length,
              accountsCount: mergedAccounts.length,
              stockItemsCount: mergedStock.length,
            },
            data: {
              app_active_firm_id: TARGET_FIRM_ID,
              active_firm_profile: cleanFirmProfile,
              firm_list: [cleanFirmProfile],
              app_firms: [cleanFirmProfile],
              [`app_fy_registry_${TARGET_FIRM_ID}`]: fyList,
              [`account_heads_${TARGET_FIRM_ID}`]: mergedAccounts,
              [`app_accounts_${TARGET_FIRM_ID}`]: mergedAccounts,
              [`inventory_items_${TARGET_FIRM_ID}`]: mergedStock,
              [`app_stock_${TARGET_FIRM_ID}`]: mergedStock,
              [`purchase_bills_${TARGET_FIRM_ID}`]: mergedBills,
              [`account_book_vouchers_${TARGET_FIRM_ID}`]: mergedVouchers,
              [`app_vouchers_${TARGET_FIRM_ID}`]: mergedVouchers,
              universal_material_adjustments_FIRM_1790909076433:
                srcData.universal_material_adjustments_FIRM_1790909076433 || [],
            },
          };

          const blob = new Blob([JSON.stringify(cleanedOutput, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'Neelkanth_Int_Udyog_Clean_2026-11-23.json';
          a.click();
          URL.revokeObjectURL(url);

          statusEl.textContent = 'सफल! साफ़ की गई फ़ाइल डाउनलोड हो गई है:\n' + JSON.stringify(cleanedOutput.stats, null, 2);
        } catch (err) {
          statusEl.textContent = 'त्रुटि: ' + err.message;
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
