// frontend/android/app/build.gradle

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.neelkanth.accountbook"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 3 // Purane APK se hamesha +1 bada rakhein (e.g., 1 -> 2 -> 3)
        versionName "1.0.2" // Release Version
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
