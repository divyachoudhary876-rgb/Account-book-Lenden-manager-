<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Book</title>
    <style>
      /* Lightweight inline CSS - renders instantly before JS bundle loads */
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        font-family: Arial, sans-serif;
      }
      #root-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #ffffff;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant Splash Loader (Disappears when React mounts) -->
      <div id="root-loader">
        <div class="spinner"></div>
        <h3 style="margin-top: 16px; font-size: 16px;">Account Book</h3>
        <p style="font-size: 11px; color: #94a3b8; margin: 0;">Loading Accounting Engine...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
