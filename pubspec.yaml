name: account_book_lenden_manager
description: "Enterprise Double-Entry Accounting & GST Billing Engine"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Date & Currency Formatting
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

  # PDF Generation & Direct Printing
  pdf: ^3.10.8
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
